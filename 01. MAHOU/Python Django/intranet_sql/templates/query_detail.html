{% extends 'base_workspace.html' %}
{% block title %}{{ query.name }}{% endblock %}
{% block content %}
<h1>{{ query.name }}</h1><p class="muted">{{ query.description }}</p>
<form method="post" action="{% url 'run_query' query.code %}">{% csrf_token %}{{ form.as_p }}<button type="submit">Ejecutar en segundo plano</button></form>
<p>Al terminar podrás ver una muestra y descargar el CSV o Excel completo.</p>
{% endblock %}
